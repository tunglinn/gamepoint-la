<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GamePointLa — Edit volleyball match videos on your phone</title>
  <meta name="description" content="Mark rallies in your volleyball footage and export highlights with a live scoreboard — right in your phone's browser. Free, no upload, no account.">
  <link rel="icon" type="image/png" href="img/icon.png">
  <meta name="theme-color" content="#FFFFFF">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing/index.css">
  <link rel="prefetch" href="/app">
</head>
<body>

  <header class="brand">GamePointLa</header>

  <main class="stage">
    <section class="pitch">
      <h1>
        Edit your match
        <span class="rotator">
          <span class="phrase is-active">on your commute.</span>
          <span class="phrase">on your lunch break.</span>
          <span class="phrase">between matches.</span>
          <span class="phrase">on the bus home.</span>
          <span class="phrase">in the bleachers.</span>
          <span class="phrase">before practice.</span>
        </span>
      </h1>
      <p class="sub">Tap to mark each rally. Export highlights with the score on screen.</p>
    </section>

    <!-- DEMO: drop a short screen recording at img/demo.mp4 (muted, ~10–15s, <1.5MB).
         Until it exists the poster screenshot is shown instead. -->
    <div class="demo">
      <video class="demo-video" autoplay muted loop playsinline preload="auto"
             poster="img/mark_serve.png" aria-label="GamePointLa marking a rally and exporting it">
        <source src="img/demo.mp4" type="video/mp4">
      </video>
    </div>

    <section class="action">
      <a href="/app" class="start-btn" aria-label="Press start — open the editor">
        <svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect class="body" x="6.5" y="1.5" width="11" height="21" rx="2.5"/>
          <rect class="speaker" x="10" y="3.2" width="4" height="1.2" rx="0.6"/>
        </svg>
        <span class="start-label">Press Start</span>
        <svg class="face-btns" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="16" cy="8" r="4"/>
          <circle cx="8" cy="16" r="4"/>
        </svg>
      </a>
      <p class="trust">Free · No upload · No account · <a href="https://www.youtube.com/watch?v=ZIPILL4TE3k" target="_blank" rel="noopener">How it works</a></p>
    </section>
  </main>

<script src="app/analytics.js"></script>
<script src="landing/index.js"></script>
<script>trackEvent('page_view');</script>
</body>
</html>
